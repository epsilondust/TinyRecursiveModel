<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675' width='1200' height='675' font-family='Helvetica Neue, Helvetica, Arial, sans-serif'><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker></defs><rect width='1200' height='675' fill='#fcfcfb'/><text x='60' y='68' font-size='30' fill='#0b0b0b' font-weight='bold' text-anchor='start'>One small block, run again and again</text><text x='60' y='100' font-size='18' fill='#52514e' font-weight='normal' text-anchor='start'>The model has one layer. It runs that layer 32 times, and the board settles a little on each pass.</text><rect x='50' y='290' width='140' height='80' rx='8' fill='#ffffff' stroke='#0b0b0b' stroke-width='1.5'/><text x='120.0' y='326.0' font-size='18' fill='#0b0b0b' font-weight='bold' text-anchor='middle'>Puzzle</text><text x='120.0' y='348.0' font-size='14' fill='#52514e' font-weight='normal' text-anchor='middle'>81 cells</text><rect x='230' y='290' width='150' height='80' rx='8' fill='#ffffff' stroke='#0b0b0b' stroke-width='1.5'/><text x='305.0' y='326.0' font-size='18' fill='#0b0b0b' font-weight='bold' text-anchor='middle'>Embed</text><text x='305.0' y='348.0' font-size='14' fill='#52514e' font-weight='normal' text-anchor='middle'>96 numbers a cell</text><path d='M190,330 L228,330' fill='none' stroke='#52514e' stroke-width='2' marker-end='url(#arrow)'/><rect x='430' y='170' width='540' height='330' rx='12' fill='#f3f2ee' stroke='#52514e' stroke-width='1.5' stroke-dasharray='6 5'/><text x='450' y='200' font-size='17' fill='#0b0b0b' font-weight='bold' text-anchor='start'>One block. The same weights on every pass.</text><rect x='455' y='290' width='120' height='80' rx='8' fill='#ffffff' stroke='#0b0b0b' stroke-width='1.5'/><text x='515.0' y='326.0' font-size='18' fill='#0b0b0b' font-weight='bold' text-anchor='middle'>Add clues</text><text x='515.0' y='348.0' font-size='14' fill='#52514e' font-weight='normal' text-anchor='middle'>back in</text><rect x='605' y='265' width='200' height='130' rx='8' fill='#ffffff' stroke='#0b0b0b' stroke-width='1.5'/><text x='705.0' y='336.0' font-size='18' fill='#0b0b0b' font-weight='bold' text-anchor='middle'></text><text x='705' y='292' font-size='18' fill='#0b0b0b' font-weight='bold' text-anchor='middle'>Mesh attention</text><rect x='635' y='310' width='14' height='14' rx='3' fill='#2a78d6'/><text x='658' y='322' font-size='15' fill='#0b0b0b' font-weight='normal' text-anchor='start'>2 heads: row</text><rect x='635' y='336' width='14' height='14' rx='3' fill='#eb6834'/><text x='658' y='348' font-size='15' fill='#0b0b0b' font-weight='normal' text-anchor='start'>2 heads: column</text><rect x='635' y='362' width='14' height='14' rx='3' fill='#1baf7a'/><text x='658' y='374' font-size='15' fill='#0b0b0b' font-weight='normal' text-anchor='start'>2 heads: box</text><rect x='835' y='290' width='110' height='80' rx='8' fill='#ffffff' stroke='#0b0b0b' stroke-width='1.5'/><text x='890.0' y='326.0' font-size='18' fill='#0b0b0b' font-weight='bold' text-anchor='middle'>MLP</text><text x='890.0' y='348.0' font-size='14' fill='#52514e' font-weight='normal' text-anchor='middle'>per cell</text><path d='M380,330 L453,330' fill='none' stroke='#52514e' stroke-width='2' marker-end='url(#arrow)'/><path d='M575,330 L603,330' fill='none' stroke='#52514e' stroke-width='2' marker-end='url(#arrow)'/><path d='M805,330 L833,330' fill='none' stroke='#52514e' stroke-width='2' marker-end='url(#arrow)'/><path d='M890,290 L890,232 L515,232 L515,288' fill='none' stroke='#52514e' stroke-width='2' marker-end='url(#arrow)'/><text x='702' y='224' font-size='16' fill='#52514e' font-weight='normal' text-anchor='middle'>32 passes</text><path d='M305,370 L305,450 L515,450 L515,372' fill='none' stroke='#52514e' stroke-width='2' marker-end='url(#arrow)'/><text x='420' y='472' font-size='14' fill='#52514e' font-weight='normal' text-anchor='end'>the clues, on every pass</text><rect x='1010' y='290' width='140' height='80' rx='8' fill='#ffffff' stroke='#0b0b0b' stroke-width='1.5'/><text x='1080.0' y='326.0' font-size='18' fill='#0b0b0b' font-weight='bold' text-anchor='middle'>Readout</text><text x='1080.0' y='348.0' font-size='14' fill='#52514e' font-weight='normal' text-anchor='middle'>9 scores a cell</text><path d='M945,330 L1008,330' fill='none' stroke='#52514e' stroke-width='2' marker-end='url(#arrow)'/><text x='1080' y='396' font-size='14' fill='#52514e' font-weight='normal' text-anchor='middle'>Scored after</text><text x='1080' y='414' font-size='14' fill='#52514e' font-weight='normal' text-anchor='middle'>every pass</text><text x='60' y='600' font-size='44' fill='#0b0b0b' font-weight='bold' text-anchor='start'>113,673</text><text x='60' y='628' font-size='16' fill='#52514e' font-weight='normal' text-anchor='start'>weights in the whole model</text><text x='450' y='600' font-size='44' fill='#0b0b0b' font-weight='bold' text-anchor='start'>32</text><text x='450' y='628' font-size='16' fill='#52514e' font-weight='normal' text-anchor='start'>passes through one block</text><text x='840' y='600' font-size='44' fill='#0b0b0b' font-weight='bold' text-anchor='start'>20</text><text x='840' y='628' font-size='16' fill='#52514e' font-weight='normal' text-anchor='start'>neighbors a cell can hear</text></svg>